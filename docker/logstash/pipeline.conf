# Docker version of elk/logstash-pipeline.conf:
# reads the app log from the shared ./logs mount and ships to the host's Elasticsearch.
input {
  file {
    path => "/app-logs/app.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_app_log"
    codec => plain
    type => "php-app-log"
  }
}

filter {
  json {
    source => "message"
  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    timezone => "Asia/Jakarta"
  }

  mutate {
    remove_field  => ["timestamp", "host", "path"]
    add_field     => { "application" => "sistem_pelaporan_jalan" }
    add_field     => { "environment" => "development" }
  }

  if [level] == "ERROR" {
    mutate { add_tag => ["error", "needs_attention"] }
  } else if [level] == "WARNING" {
    mutate { add_tag => ["warning"] }
  } else if [level] == "INFO" {
    mutate { add_tag => ["info"] }
  }

  if "_jsonparsefailure" in [tags] {
    drop {}
  }

  # Salinan context sebagai teks agar bisa dicari full-text (context sendiri bertipe flattened)
  ruby {
    code => "c = event.get('context'); event.set('context_text', c.to_json) if c.is_a?(Hash) && !c.empty?"
  }
}

output {
  elasticsearch {
    hosts                 => ["${ELASTICSEARCH_HOST}"]
    user                  => "${ELASTICSEARCH_USER}"
    password              => "${ELASTICSEARCH_PASSWORD}"
    ssl_verification_mode => "none"
    index                 => "app-logs-%{+YYYY.MM.dd}"
    # Mapping tetap (context = flattened) agar field context yang berbeda-beda tidak bentrok
    template              => "/usr/share/logstash/templates/app-logs-template.json"
    template_name         => "app-logs"
    template_overwrite    => true
  }
}
