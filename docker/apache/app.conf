# App served at the site root (APP_BASE_URL="" in docker-compose.yml)
<VirtualHost *:80>
    DocumentRoot /var/www/app

    # Old XAMPP-style links keep working
    RedirectMatch 301 ^/sistem_pelaporan_kerusakan_jalan(/.*)?$ $1

    <Directory /var/www/app>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteBase /
        # Never expose source, SQL, logs or ELK config
        RewriteRule ^(app|database|logs|elk|docker)(/|$) - [F,L]
        RewriteRule (^|/)\.|Dockerfile|docker-compose\.yml|\.md$ - [F,L]
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L,QSA]
    </Directory>

    <Directory /var/www/app/public/uploads>
        php_admin_flag engine off
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
