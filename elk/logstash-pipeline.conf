input {
  file {
    # !! SESUAIKAN PATH INI dengan lokasi project Anda di XAMPP
    path => "C:/xampp/htdocs/sistem_pelaporan_kerusakan_jalan/logs/app.log"
    # Mulai baca dari awal file setiap restart (development only)
    start_position => "beginning"

    # NUL = disable file tracking (development only)
    # Untuk production, hapus baris ini agar Logstash tidak membaca ulang dari awal
    sincedb_path => "NUL"

    # Setiap baris = teks (akan diparse via filter json)
    codec => plain

    # Tag sumber
    type => "php-app-log"
  }
}

filter {
  # Parse JSON dari field 'message' ke root document
  json {
    source => "message"
  }

  # 1. Parse field 'timestamp' dari PHP Logger → @timestamp Elasticsearch
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
    timezone => "Asia/Jakarta"
  }

  # 2. Hapus field duplikat + tambahkan metadata
  mutate {
    remove_field  => ["timestamp", "host", "path"]
    add_field     => { "application" => "sistem_pelaporan_jalan" }
    add_field     => { "environment" => "development" }
  }

  # 3. Tandai log berdasarkan level
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error", "needs_attention"]
    }
  } else if [level] == "WARNING" {
    mutate {
      add_tag => ["warning"]
    }
  } else if [level] == "INFO" {
    mutate {
      add_tag => ["info"]
    }
  }

  # 4. Skip baris kosong atau baris yang gagal di-parse
  if "_jsonparsefailure" in [tags] {
    drop {}
  }
}

output {
  # Kirim ke Elasticsearch
  elasticsearch {
    hosts  => ["http://localhost:9200"]
    index  => "app-logs-%{+YYYY.MM.dd}"
    # Hapus user/password jika xpack.security.enabled: false
    # user   => "elastic"
    # password => "YOUR_PASSWORD"
  }

  # Cetak ke console untuk debugging (bisa dihapus di production)
  stdout {
    codec => rubydebug
  }
}
