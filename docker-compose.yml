services:
  app:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "${APP_PORT:-8181}:80"
    environment:
      APP_BASE_URL: ""
      DB_HOST: db
      DB_NAME: db_pelaporan_jalan
      DB_USER: laporjalan
      DB_PASSWORD: ${DB_PASSWORD:-laporjalan}
      # Menu Monitor Logging membaca log dari Elasticsearch host
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-https://host.docker.internal:9200}
      ELASTICSEARCH_USER: ${ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      KIBANA_URL: ${KIBANA_URL:-http://localhost:5601}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Live-edit the code; logs/ and uploads/ end up in the project folder
      - .:/var/www/app
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: db_pelaporan_jalan
      MYSQL_USER: laporjalan
      MYSQL_PASSWORD: ${DB_PASSWORD:-laporjalan}
      TZ: Asia/Jakarta
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3316}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeder.sql:/docker-entrypoint-initdb.d/02-seeder.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Ships logs/app.log to the Elasticsearch already running on the host
  logstash:
    image: docker.elastic.co/logstash/logstash:${ELK_VERSION:-8.19.15}
    environment:
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST:-https://host.docker.internal:9200}
      ELASTICSEARCH_USER: ${ELASTICSEARCH_USER:-elastic}
      ELASTICSEARCH_PASSWORD: ${ELASTICSEARCH_PASSWORD:-}
      LS_JAVA_OPTS: -Xms256m -Xmx512m
      XPACK_MONITORING_ENABLED: "false"
      PIPELINE_ECS_COMPATIBILITY: disabled
    restart: on-failure:5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/logstash/pipeline.conf:/usr/share/logstash/pipeline/logstash.conf:ro
      - ./docker/logstash/app-logs-template.json:/usr/share/logstash/templates/app-logs-template.json:ro
      - ./logs:/app-logs:ro
      - logstash_data:/usr/share/logstash/data
    depends_on:
      - app

volumes:
  db_data:
  logstash_data:
